name: Restore original .htaccess

# One-off: extracts the original .htaccess from briefnepal-jobs-hostinger.zip
# (already on the server) and uploads it to the public_html ROOT, restoring
# the BriefNepal site's clean-URL routing. Does not touch apps/.
on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Extract and restore .htaccess to root
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lftp unzip
          # 1) download the source zip
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<'EOF'
          set ftp:ssl-allow no
          set net:timeout 30
          get briefnepal-jobs-hostinger.zip -o src.zip
          bye
          EOF
          # 2) extract the .htaccess
          unzip -o -j src.zip '.htaccess' -d out
          echo "=== .htaccess to be restored ($(wc -l < out/.htaccess) lines) ==="
          cat out/.htaccess
          # 3) upload it to the public_html root (cwd of the jailed account)
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<'EOF'
          set ftp:ssl-allow no
          set net:timeout 30
          put out/.htaccess -o .htaccess
          echo ">>> root listing after restore:"
          cls -la .htaccess
          bye
          EOF
          echo "Done."
