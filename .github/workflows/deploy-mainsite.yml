name: Deploy BriefNepal main site (one-off)

# One-off, manual. Downloads the frontend snapshot (private release asset built
# from briefnepal.zip) and mirrors it into the live public_html ROOT over FTP.
# No --delete: only adds/updates files, never wipes server-side data or apps/.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Download frontend snapshot asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download frontend-snapshot-20260720 -R intmain10/apps-briefnepal -p site.zip
          mkdir -p dist && unzip -q site.zip -d dist
          echo "Extracted $(find dist -type f | wc -l) files, $(du -sh dist | cut -f1)."

      - name: Mirror to public_html over FTP (no delete)
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lftp
          for attempt in 1 2 3; do
            echo "=== mirror attempt $attempt ==="
            if timeout 900 lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<'EOF'
          set ftp:ssl-allow no
          set ftp:passive-mode on
          set net:timeout 20
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set mirror:parallel-transfer-count 3
          set mirror:use-pget-n 1
          mirror -R --no-perms --overwrite dist/ .
          bye
          EOF
            then
              echo "Mirror OK on attempt $attempt."
              exit 0
            fi
            echo "attempt $attempt failed/timed out; waiting 20s…"; sleep 20
          done
          echo "::error::mirror failed after 3 attempts"; exit 1
