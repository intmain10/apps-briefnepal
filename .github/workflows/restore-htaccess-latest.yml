name: Restore latest .htaccess

# One-off, manual. Uploads the latest BriefNepal .htaccess (committed at
# .github/main.htaccess, taken from briefnepal.zip) to the public_html ROOT.
# Does not touch apps/. .github/ is excluded from the apps deploy.
on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload latest .htaccess to root
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lftp
          echo "=== .htaccess to upload ($(wc -l < .github/main.htaccess) lines) ==="
          head -18 .github/main.htaccess
          timeout 100 lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<'EOF'
          set ftp:ssl-allow no
          set ftp:passive-mode on
          set net:timeout 15
          set net:max-retries 3
          set net:reconnect-interval-base 5
          put .github/main.htaccess -o .htaccess
          cls -la .htaccess
          bye
          EOF
          echo "Done."
