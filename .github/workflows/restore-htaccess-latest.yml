name: Restore latest .htaccess

# One-off, manual. Writes the LATEST BriefNepal .htaccess (from briefnepal.zip,
# base64-embedded below) to the public_html ROOT. Does not touch apps/.
on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Decode and upload latest .htaccess to root
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lftp
          cat > htaccess.b64 <<'B64EOF'

B64EOF
          base64 -d htaccess.b64 > out.htaccess
          echo "=== decoded .htaccess ($(wc -l < out.htaccess) lines) ==="
          head -20 out.htaccess
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<'EOF'
          set ftp:ssl-allow no
          set net:timeout 30
          put out.htaccess -o .htaccess
          cls -la .htaccess
          bye
          EOF
          echo "Done."
