name: Deploy to Hostinger

# Runs automatically on every push to main, and can be triggered manually.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # SAFETY GUARD: this repo deploys ONLY to apps.briefnepal.com (public_html/apps).
      # It must never write to the main briefnepal.com root. If server-dir is ever
      # changed away from ./apps/, fail the deploy instead of risking the main site.
      - name: Guard — refuse to deploy outside ./apps/
        run: |
          if ! grep -qE '^[[:space:]]*server-dir:[[:space:]]*\./apps/[[:space:]]*$' .github/workflows/deploy.yml; then
            echo "::error::server-dir must be exactly ./apps/ — this repo may only deploy to apps.briefnepal.com."
            exit 1
          fi
          echo "Guard OK — deploying only to ./apps/ (apps.briefnepal.com)."

      - name: Sync files to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # --- Connection (set these as repo Secrets, never hardcode) ---
          server: ${{ secrets.FTP_SERVER }}       # e.g. ftp.briefnepal.com  (or 93.127.208.217)
          username: ${{ secrets.FTP_USERNAME }}   # e.g. u682902872
          password: ${{ secrets.FTP_PASSWORD }}   # your FTP password
          port: 21
          protocol: ftp                           # switch to "ftps" if your host requires TLS

          # --- Where files land on the server ---
          # ⚠️ DO NOT CHANGE. This repo is ONLY for apps.briefnepal.com.
          # The FTP account lands in public_html (shared with the main
          # briefnepal.com site), and the apps subdomain's docroot is
          # public_html/apps — so we deploy into ./apps/ and nowhere else.
          # Setting this to "./" or "/public_html/" would overwrite the main
          # BriefNepal news site. The guard step above enforces ./apps/.
          server-dir: ./apps/

          # Incremental sync: only changed files are uploaded (state file kept on server).
          # Files you delete from the repo are also removed from the server.
          dangerous-clean-slate: false

          # --- Never upload these ---
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/.DS_Store
            README.md
            CLAUDE.md
            .gitignore
            database/**
            /uploads/**
            **/*.log
            config.local.php
            # Keep production config.php on the server — uncomment the next line
            # once you've set your real DB credentials in config.php on the host:
            # config.php
